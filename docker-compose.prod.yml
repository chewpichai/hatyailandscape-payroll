version: '3.7'

services:
  mongo:
    image: mongo
    volumes:
      - mongo_data:/data/db
  sftp:
    depends_on:
      - mongo
    image: atmoz/sftp
    volumes:
      - ./sftp/sshd_config:/etc/ssh/sshd_config
    ports:
      - "2222:22"
    command: user:pass
  app:
    depends_on:
      - mongo
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: runner
    volumes:
      - ./uploads:/app/public/uploads
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGO_URI
      - JWT_SECRET
      - NEXT_PUBLIC_BASE_PATH

volumes:
  mongo_data:
